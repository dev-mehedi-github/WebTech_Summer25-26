
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Info</title>
    <!-- <link rel="stylesheet" href="C:\Users\student\Desktop\wentech j\Lab Task1\Design\design.css"> lab pc -->
    <link rel="stylesheet" href="../Design/design.css">
    <script src="../Javascript/script.js"></script>
     <!-- dirctory for mac -->
</head>
<body>
    
    <div class="container">
        <fieldset>
            <legend>Student Information</legend>
            <form onsubmit=" return collect_data()">
        <table>
            <tr> 
                <td><label for="Name" >Full Name</label></td> 
                <td><label for="Email">Email</label></td>
            </tr>

            <tr>
                <td><input type="text" id="name" name="name" placeholder="Enter your name"></td>
                <td><input type="email" id="email" name="eamil" placeholder="your.email@example.com"></td>
            </tr>

            <tr> 
                <td><label for="Password" >Password</label></td> 
                <td><label for="Age">Age</label></td>
            </tr>

            <tr>
                <td><input type="password" id="pass" name="pass" placeholder="Enter secure password"></td>
                <td><input type="number" id="age" name="age" placeholder="Enter your age"></td>
            </tr>

            <tr> 
                <td><label for="ExpDate" >Experiment date</label></td> 
                <td><label for="phone">Phone number </label></td>
            </tr>
            <tr>
                <td><input type="date" id="ExpDate" name="ExpDate"></td>
                <td><input type="tel" id="phone" name="phone" placeholder="+880 XXXX XXXXXX"></td>
            </tr>
        </table>
        </fieldset>
        <div class="btn-group">
            <input type="submit" id="submit" name="submit" value="SignUp">
            <input type="reset" id="reset" name="reset">
        </div>
        </form> 
    </div>
</body>
</html>
