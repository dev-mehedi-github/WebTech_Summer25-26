<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Calculation</title>
        <link rel="stylesheet" href="/Users/batman/Desktop/Code (MAC)/WebTech_Summer25-26/Mid Terrm/zHomePractice/Calculator/Design/design.css">
    </head>
    <body>
        <h1>Simple Calculator</h1>
        <div class="container">
            <form>
                <div class="screen">
                    <input type="text" id="display" name="display">
                </div>
                <table>
                    <tbody>
                        <tr>
                            <td><input type="button" id="Ac" name="Ac" value="AC"></td>
                            <td><input type="button" id="del" name="del" value="DEL"></td>
                            <td><input type="button" id="percent" name="percent" value="%"></td>
                            <td><input type="button" id="add" name="add" value="+"></td>
                        </tr>
                        <tr>
                            <td><input type="button" id="btn7" name="btn7" value="7"></td>
                            <td><input type="button" id="btn8" name="btn8" value="8"></td>
                            <td><input type="button" id="btn9" name="btn9" value="9"></td>
                            <td><input type="button" id="sub" name="sub" value="-"></td>
                        </tr>
                        <tr>
                            <td><input type="button" id="btn4" name="btn4" value="4"></td>
                            <td><input type="button" id="btn5" name="btn5" value="5"></td>
                            <td><input type="button" id="btn6" name="btn6" value="6"></td>
                            <td><input type="button" id="mult" name="mult" value="*"></td>
                        </tr>
                        <tr>
                            <td><input type="button" id="btn1" name="btn1" value="1"></td>
                            <td><input type="button" id="btn2" name="btn2" value="2"></td>
                            <td><input type="button" id="btn3" name="btn3" value="3"></td>
                            <td><input type="button" id="div" name="div" value="/"></td>
                        </tr>
                        <tr>
                            <td><input type="button" id="btn0" name="btn0" value="0"></td>
                            <td><input type="button" id="dot" name="dot" value="."></td>
                            <td colspan="2"><input type="button" id="equal" name="equal" value="=" style="width:100%;"></td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>
    </body>
</html>
