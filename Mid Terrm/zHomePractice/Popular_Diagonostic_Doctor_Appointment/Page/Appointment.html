<!doctype html>
<html lang="es-Us">

<head>
    <title>New Appointment</title>
    <link rel="shortcut icon" href="../Assets/images.png" type="image/x-icon">
    <link rel="stylesheet" href="../Design/style.css" />
</head>

<body>
    <nav>
        <div class="container nav__container">
            <img src="../Assets/images.png" alt="" style="width: 28px">

            <ul class="nav_menu">
                <li><a href="../Page/Appointment.html">Home</a></li>
                <li>
                    <a href="../Page/Appointment.html">Online Doctor Appointment</a>
                </li>
                <li><a href="">Login</a></li>
                <li><a href="">Forget Password</a></li>
            </ul>
            <hr />
        </div>
    </nav>

    <header>
        <div class="container header__container">
            <div class="header__center">
                <h1>Doctor Appointment</h1>
                <table>
                    <tr>
                        <td>
                            <h4>Appointment Date :</h4>
                        </td>
                        <td>
                            <p id="date_now"></p>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <h5>*** Advance Appointment booking is not available.</h5>
                        </td>
                    </tr>
                </table>
                <hr />
            </div>
        </div>
    </header>

    <main>
        <div class="container main__container">
            <div class="selection__form">
                <table>
                    <tr>
                        <td><label for="chBranch">Choose Branch</label></td>
                        <td><label for="Speciality">Speciality</label></td>
                    </tr>

                    <tr>
                        <td>
                            <img src="../Assets/list.png" alt="" style="width: 18px">
                            <select name="choose_Branch" id="choose_Branch">
                                <option value="ChooseBranch">Choose Branch</option>
                                <option value="DHM">Dhanmondi</option>
                                <option value="SA">Savar</option>
                                <option value="UTT4">Uttora Sector 4</option>
                                <option value="UTT13">Uttora Sector 13</option>
                            </select>
                        </td>

                        <td>
                            <img src="../Assets/list.png" alt="" style="width: 18px">
                            <select name="speciality" id="speciality">
                                <option value="Speciality">Choose Specialist</option>
                                <option value="CS">Colorectal Surgery</option>
                                <option value="EM">Endocrine Medicine</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <img src="../Assets/user.png" alt="" style="width: 18px">
                            <select name="chDr" id="chDr">
                                <!-- <option value=""><input type="text" id="srcDr" name="srcDr"></option> -->
                                <option value="chDoc">Chose a Doctor</option>
                                <option value="FE">Dr. Farhan Esraq</option>
                                <option value="SK">Dr. Samiha Karim</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <img src="../Assets/user.png" alt="" style="width: 18px">
                            <input type="text" id="note" name="note" placeholder="Leave a note(Optional)">
                        </td>
                    </tr>
                </table>
            </div>
            <hr>

            <div class="patient__info">
                <ul class="register__menu">
                    <li><a href="">New Patient</a></li>
                    <li><a href="">Already Registered ?</a></li>
                </ul>
                <hr>

                <table>
                    <tr>
                        <td><label for="Name">Name</label> </td>
                        <td><label for="Phone">Phone</label></td>
                        <td><label for="Age">Age</label></td>
                        <td><label for="Gender">Gender</label< /td>

                    </tr>

                    <tr>
                        <td><input type="text" id="pname" name="pname"></td>
                        <td><input type="text" id="pnum" name="pmum"></td>
                        <td><input type="number" name="page" id="page"></td>
                        <td>
                            <select name="gender" id="pgender">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="others">Others</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <input type="checkbox" name="condt" id="condt">
                            <label for="condt">I agree to the Terms and Conditions</label>
                        </td>
                    </tr>
                </table>
                <hr>
            </div>
        </div>
    </main>
    
    <div class="login__btn">
        <table>
            <tr>
                <td><img src="../Assets/login.png" alt="" width="18px"></td>
                <td><input type="submit" id="ConfirmApp" value="Confirm Appointment"></td>
            </tr>
        </table>

    </div>
</body>

</html>
