<!DOCTYPE html>
<html lang="es-US">

<head>
    <title>Form</title>
    <link rel="stylesheet" href="../Design/style.css">
    <script src="../JavaScript/script.js"></script>
</head>

<body>
    <div class="header">
        <h1>Registration Form</h1>
    </div>

    <div class="topnav">
        <a href=" ">Home</a>
        <a href=" ">Menu</a>
    </div>

    <div class="container">
        <form action="" onsubmit="return collectData()">
            <fieldset>
                <legend>Personal Information</legend>
                <table>
                    <tr>
                        <td> <label for="PNM">Patient Name:</label></td>
                        <td><input type="text" id="pName" name="pName" placeholder="Enter your name"></td>
                        <p id="pNmError"></p>
                    </tr>

                    <tr>
                        <td><label for="age">Patient age:</label></td>
                        <td><input type="number" id="pAge" name="pAge">
                            <p id="ageError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td> <label for="gender">Gender: </label></td>
                        <td>
                            <input type="radio" id="gender" name="gender" value="Male">
                            <label for="Male">Male</label>
                            <input type="radio" id="gender" name="gender" value="Female">
                            <label for="Female">Female</label>
                            <input type="radio" name="gender" id="gender" value="Others">
                            <label for="Others">Others</label>
                            <p id="genError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" id="pEmail" name="pEmail" placeholder="example@eamil.com">
                            <p id="emailError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="phone"> Phone</label></td>
                        <td><input type="tel" id="number" name="number" placeholder="+880 XXXX XXXXXXX">
                            <p id="phoneError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td> <label for="dob"> Date of birth</label></td>
                        <td> <input type="date" id="dob" name="dob">
                            <p id="dobError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="BG">Bloodgroup:</label></td>
                        <td>
                            <select name="Bg" id="Bg">
                                <option value="Df">Choose</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                            <p id="bgError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Interest">Interest</label></td>
                        <td>
                            <input type="checkbox" id="interest" name="interest" value="Sports">
                            <label for="Sports">Sports</label>
                            <input type="checkbox" id="interest" name="interest" value="Gaming">
                            <label for="Gaming">Gaming</label>
                            <input type="checkbox" id="Reading" name="Hobby" value="Reading">
                            <label for="Reading">Reading</label>
                            <input type="checkbox" id="None" name="Hobby" value="None">
                            <label for="None">Nane</label>
                            <p id="interestError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="address">Address</label></td>
                        <td><textarea name="address" id="address" cols="40" rows="2" style="resize: none;"
                                placeholder="road,sector,city"></textarea>
                            <p id="adresError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td> <label for="file"> Upload picture: </label> </td>
                        <td> <input type="file" id=file name=file>
                            <p id="fileupError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <input type="checkbox" id="Condition" name="Conditions" value="Conditions">
                            <label for="Conditions" id="Conditions">
                                <font color="red"> I Agree Terms and Conditions * </font>
                            </label>
                            <p id="condtError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="password">Password</label></td>
                        <td><input type="password" id="pass" name="pass" placeholder="Enter password">
                            <p id="passError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><input type="submit" id=submit name=submit value="Sign In"></td>
                        <td><input type="reset" id="reset" name="reset" value="Reset"></td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </div>



</body>

</html>
